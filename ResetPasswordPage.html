<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edu2Job Reset Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #c3d9ff, #d9ccff, #b3e5fc);
        }

        .container {
            display: flex;
            width: 90%;
            max-width: 1000px;
            height: 650px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        /* Left Section */
        .left-section {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1523580846011-d3a5bc25702b?auto=format&fit=crop&w=1000&q=80') no-repeat center center/cover;
            position: relative;
        }

        .left-section .overlay {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: rgba(50, 40, 100, 0.6);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
        }

        .left-section h1 {
            font-size: 2.6rem;
            margin-bottom: 15px;
        }

        .left-section h1 span {
            color: #ffda79;
        }

        .left-section p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #f3f3f3;
        }

        /* Right Section */
        .right-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #f7f8ff, #eef2ff);
        }

        .reset-box {
            width: 85%;
            max-width: 380px;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        .reset-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #444;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus {
            border-color: #6a75ff;
            box-shadow: 0 0 5px rgba(106, 117, 255, 0.4);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #5d6fff, #7f91ff);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(93, 111, 255, 0.4);
        }

        .links {
            margin-top: 18px;
            text-align: center;
        }

        .links a {
            text-decoration: none;
            color: #5d6fff;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #3340d3;
        }

        /* Loading indicator */
        .loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #5d6fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Password strength indicator */
        .password-strength {
            margin-top: 5px;
            font-size: 0.8rem;
            height: 15px;
        }
        .strength-weak { color: #e74c3c; }
        .strength-medium { color: #f39c12; }
        .strength-strong { color: #27ae60; }

        /* Password match indicator */
        .password-match {
            margin-top: 5px;
            font-size: 0.8rem;
            height: 15px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
            }

            .left-section {
                height: 250px;
            }

            .right-section {
                padding: 20px 0;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Left Section -->
        <div class="left-section">
            <div class="overlay">
                <h1>Reset <span>Password</span></h1>
                <p>Verify your identity and set a new password to regain access to your Edu2Job account.</p>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right-section">
            <div class="reset-box">
                <h2>Reset Password</h2>
                <form id="resetForm">
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label>Favourite Cricketer</label>
                        <input type="text" id="cricketer" placeholder="Enter your favourite cricketer" required>
                    </div>
                    <div class="input-group">
                        <label>New Password</label>
                        <input type="password" id="newPassword" placeholder="Enter new password" required>
                        <div class="password-strength" id="passwordStrength"></div>
                    </div>
                    <div class="input-group">
                        <label>Re-type Password</label>
                        <input type="password" id="confirmPassword" placeholder="Re-enter new password" required>
                        <div class="password-match" id="passwordMatch"></div>
                    </div>
                    <button type="submit" class="btn" id="resetBtn">Reset Password</button>
                    <div class="loading" id="loadingIndicator">
                        <div class="loading-spinner"></div>
                        <p>Resetting password...</p>
                    </div>
                </form>

                <div class="links">
                    <a href="./index.html">← Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const resetBtn = document.getElementById("resetBtn");
        const loadingIndicator = document.getElementById("loadingIndicator");
        const passwordStrength = document.getElementById("passwordStrength");
        const passwordMatch = document.getElementById("passwordMatch");
        const newPasswordInput = document.getElementById("newPassword");
        const confirmPasswordInput = document.getElementById("confirmPassword");

        // Check password strength
        newPasswordInput.addEventListener("input", function() {
            const password = this.value;
            let strength = "";
            let strengthClass = "";
            
            if (password.length === 0) {
                strength = "";
            } else if (password.length < 6) {
                strength = "Weak";
                strengthClass = "strength-weak";
            } else if (password.length < 8) {
                strength = "Medium";
                strengthClass = "strength-medium";
            } else {
                // Check for complexity
                const hasUpperCase = /[A-Z]/.test(password);
                const hasLowerCase = /[a-z]/.test(password);
                const hasNumbers = /\d/.test(password);
                const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);
                
                const complexityScore = [hasUpperCase, hasLowerCase, hasNumbers, hasSpecialChar].filter(Boolean).length;
                
                if (complexityScore >= 3) {
                    strength = "Strong";
                    strengthClass = "strength-strong";
                } else if (complexityScore >= 2) {
                    strength = "Medium";
                    strengthClass = "strength-medium";
                } else {
                    strength = "Weak";
                    strengthClass = "strength-weak";
                }
            }
            
            passwordStrength.textContent = strength;
            passwordStrength.className = `password-strength ${strengthClass}`;
        });

        // Check password match
        confirmPasswordInput.addEventListener("input", function() {
            const password = newPasswordInput.value;
            const confirmPassword = this.value;
            
            if (confirmPassword.length === 0) {
                passwordMatch.textContent = "";
            } else if (password === confirmPassword) {
                passwordMatch.textContent = "✓ Passwords match";
                passwordMatch.style.color = "#27ae60";
            } else {
                passwordMatch.textContent = "✗ Passwords don't match";
                passwordMatch.style.color = "#e74c3c";
            }
        });

        document.getElementById("resetForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const cricketer = document.getElementById("cricketer").value.trim();
            const newPassword = newPasswordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            if (!email || !cricketer || !newPassword || !confirmPassword) {
                alert("Please fill in all fields.");
                return;
            }

            if (newPassword !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert("Please enter a valid email address.");
                return;
            }

            // Validate password strength
            if (newPassword.length < 6) {
                alert("Password should be at least 6 characters long.");
                return;
            }

            // Show loading indicator
            resetBtn.style.display = 'none';
            loadingIndicator.style.display = 'block';

            // Send reset password request to PHP handler
            fetch('reset_password_handler.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `email=${encodeURIComponent(email)}&cricketer=${encodeURIComponent(cricketer)}&newPassword=${encodeURIComponent(newPassword)}`
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                // Hide loading indicator
                resetBtn.style.display = 'block';
                loadingIndicator.style.display = 'none';
                
                if (data.status === 'success') {
                    alert("Password reset successful! You can now log in with your new password.");
                    document.getElementById("resetForm").reset();
                    passwordStrength.textContent = "";
                    passwordMatch.textContent = "";

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                } else {
                    alert(data.message || "Password reset failed. Please try again.");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                // Hide loading indicator
                resetBtn.style.display = 'block';
                loadingIndicator.style.display = 'none';
                alert("Password reset failed. Please check your connection and try again.");
            });
        });
    </script>
</body>
</html>
